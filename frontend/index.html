<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Job Outreach Email Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ['selector', '[data-theme="dark"]'],
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
            },
            colors: {
              accent: { DEFAULT: '#5A5FE0', dark: '#4A4FD2', light: '#8B8FF0', tint: '#ECEDFC' },
              mint: '#6FE0D2',
              coral: '#F5906F',
              sky: '#8CCDF0'
            },
            borderRadius: { xl: '14px', '2xl': '20px', '3xl': '24px' },
            boxShadow: {
              glass: '0 10px 30px -14px rgba(40,40,80,0.16)',
              card: '0 10px 30px -14px rgba(40,40,80,0.16)',
              'card-lg': '0 22px 48px -20px rgba(40,40,80,0.24)',
              glow: '0 14px 30px -10px rgba(90,95,224,0.5)'
            },
            keyframes: {
              fadeIn: { from: { opacity: 0, transform: 'translateY(6px)' }, to: { opacity: 1, transform: 'translateY(0)' } },
              popIn: { from: { opacity: 0, transform: 'translateY(6px) scale(.98)' }, to: { opacity: 1, transform: 'translateY(0) scale(1)' } }
            },
            animation: {
              fadeIn: 'fadeIn .3s ease-out',
              popIn: 'popIn .3s cubic-bezier(.2,.9,.3,1.1)'
            }
          }
        }
      };
    </script>
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
